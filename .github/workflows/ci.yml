name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore
        run: dotent restore ServerSideDotnet/Lab5.slnx

      - name: Build
        run: dotnet build ServerSideDotnet/lab5.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ServerSideDotnet/lab5.slnx -c Release --no-build --verbosity normal


